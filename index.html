<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:," />
<title>Rabbit Maze — Bonus</title>
<style>
  :root{
    --ink:#23405E; --ink2:#4A6B8A;
    --orange:#F07D1A; --orange-dark:#D95F06; --green:#5FA84C; --green-dark:#3E7D32;
    --field:#35702B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Arial Rounded MT Bold","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--field); color:var(--ink);
    height:100dvh; display:flex; flex-direction:column; overflow:hidden;
  }

  /* Maze stage — takes almost the whole screen */
  .stage{flex:1; min-height:0; display:grid; place-items:center; padding:6px}
  .board{
    position:relative; aspect-ratio:16/9;
    height:min(100%, calc((100vw - 12px) * 9 / 16));
    max-width:100%;
    border-radius:10px; overflow:hidden; background:#FBF7EC;
    box-shadow:0 4px 18px rgba(0,0,0,.35);
    touch-action:none;
  }
  .board img.bg{position:absolute; inset:0; width:100%; height:100%; display:block}
  .board canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
  #inkCanvas{cursor:crosshair}

  /* Slim progress row */
  .progress-row{
    display:flex; align-items:center; gap:10px;
    padding:3px 12px 1px; color:#fff;
  }
  .progress-row p{margin:0; font-weight:900; font-size:13px; white-space:nowrap}
  .bar{flex:1; height:10px; background:rgba(255,255,255,.28); border-radius:999px; overflow:hidden}
  .bar>i{display:block; height:100%; width:0%; background:linear-gradient(90deg,#FFB03A,var(--orange)); border-radius:999px; transition:width .3s ease}

  /* Compact toolbar — one slim bar */
  .toolbar{
    display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; justify-content:center;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  .group{display:flex; align-items:center; gap:5px; flex-wrap:wrap; justify-content:center; max-width:100%}
  .glabel{font-size:10px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.85)}
  .crayon{width:26px; height:26px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.25); cursor:pointer; padding:0}
  .crayon[aria-pressed="true"]{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink); transform:scale(1.15)}
  .sizebtn{width:26px; height:26px; border-radius:8px; border:2px solid rgba(255,255,255,.5); background:rgba(255,255,255,.92); cursor:pointer; display:grid; place-items:center; padding:0}
  .sizebtn[aria-pressed="true"]{border-color:var(--ink); background:#FFF3D6}
  .sizebtn span{display:block; border-radius:50%; background:var(--ink)}
  .toolbtn{
    font-family:inherit; font-weight:900; font-size:13px; color:var(--ink);
    background:#FFF3D6; border:2px solid #F5C66B; border-radius:9px; padding:5px 10px; cursor:pointer;
  }
  .toolbtn:active{transform:translateY(1px)}
  .toolbtn.on{background:var(--orange); border-color:var(--orange-dark); color:#fff}
  .toolbtn.test{background:#E8F4FF; border-color:#9CC8EE}
  .toolbtn.fs{background:#DCEEFF; border-color:#7FB6E8; font-size:14px; padding:8px 13px}
  .toolbtn.fs.on{background:var(--orange); border-color:var(--orange-dark); color:#fff}
  .toolbtn.clear{background:#FFEAEA; border-color:#F2A3A3}
  .toolbtn.start{
    background:var(--green); border-color:var(--green-dark); color:#fff;
    font-size:16px; padding:9px 18px; border-radius:12px;
    box-shadow:0 3px 0 var(--green-dark), 0 6px 14px rgba(0,0,0,.25);
    letter-spacing:.02em;
  }
  .toolbtn.start:active{transform:translateY(2px); box-shadow:0 1px 0 var(--green-dark)}

  /* Anchor hint — after a wall hit the last save point (or the rabbit)
     grows, blinks and calls "Start here!" until it is tapped exactly */
  .anchor-hint{position:absolute; z-index:6; width:84px; height:84px; margin:-42px 0 0 -42px; pointer-events:none; display:none}
  .anchor-hint.show{display:block}
  .anchor-hint .ah-ring{position:absolute; inset:0; border-radius:50%; border:6px solid #E03131; background:rgba(224,49,49,.14); animation:ahpulse .65s ease-in-out infinite}
  .anchor-hint .ah-bubble{
    position:absolute; left:50%; bottom:calc(100% + 4px); transform:translateX(-50%);
    background:#E03131; color:#fff; font-weight:900; font-size:15px; line-height:1;
    padding:7px 13px; border-radius:999px; white-space:nowrap;
    box-shadow:0 4px 12px rgba(0,0,0,.3); animation:ahbob .65s ease-in-out infinite;
  }
  .anchor-hint.nudge .ah-bubble{animation:ahshake .45s ease}
  .anchor-hint.nudge .ah-ring{animation:ahpulse .3s ease-in-out 2}
  @keyframes ahpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.28)}}
  @keyframes ahbob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
  @keyframes ahshake{0%,100%{transform:translateX(-50%)}20%{transform:translateX(calc(-50% - 6px))}40%{transform:translateX(calc(-50% + 6px))}60%{transform:translateX(calc(-50% - 4px))}80%{transform:translateX(calc(-50% + 4px))}}
  @media (prefers-reduced-motion: reduce){ .anchor-hint .ah-ring,.anchor-hint .ah-bubble,.anchor-hint.nudge .ah-bubble{animation:none} }


  /* Rotate-to-landscape hint (portrait phones only) */
  .rotate-hint{
    display:none;
    align-items:center; gap:10px;
    margin:8px 10px 0; padding:9px 12px;
    background:#FFF3D6; border:3px solid var(--orange); border-radius:14px;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .rotate-hint .phone{
    flex:none; width:20px; height:34px; border:3px solid var(--ink); border-radius:5px;
    position:relative; animation:tilt 1.8s ease-in-out infinite;
  }
  .rotate-hint .phone::after{content:""; position:absolute; left:50%; bottom:2px; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:var(--ink)}
  @keyframes tilt{0%,25%{transform:rotate(0deg)}60%,100%{transform:rotate(90deg)}}
  @media (prefers-reduced-motion: reduce){ .rotate-hint .phone{animation:none; transform:rotate(90deg)} }
  .rotate-hint .txt{flex:1; min-width:0}
  .rotate-hint .txt b{display:block; font-size:16px; color:var(--ink)}
  .rotate-hint .txt span{font-size:12px; font-weight:700; color:var(--ink2)}
  .rotate-hint button{
    flex:none; font-family:inherit; font-weight:900; font-size:13px; cursor:pointer;
    background:var(--green); color:#fff; border:none; border-bottom:3px solid var(--green-dark);
    border-radius:10px; padding:8px 11px;
  }
  .rotate-hint .close{
    background:transparent; color:var(--ink2); border:none; border-bottom:none;
    font-size:17px; padding:4px 6px;
  }
  @media (orientation:portrait){
    .rotate-hint{display:flex}
  }
  @media (orientation:portrait) and (min-width:700px){
    .rotate-hint{display:none}
  }

  /* Landscape: maze takes the whole screen; tools become a slim side rail */
  @media (orientation:landscape){
    body{
      display:grid;
      grid-template-columns:1fr 98px;
      grid-template-rows:auto 1fr;
      grid-template-areas:"progress tools" "stage tools";
    }
    .progress-row{grid-area:progress; padding:2px 10px 0}
    .stage{grid-area:stage; padding:4px}
    .board{height:min(100%, calc((100vw - 110px) * 9 / 16))}
    .toolbar{
      grid-area:tools; flex-direction:column; flex-wrap:nowrap;
      justify-content:flex-start; align-items:stretch;
      overflow-y:auto; overflow-x:hidden;
      padding:8px 5px calc(8px + env(safe-area-inset-bottom)); gap:10px;
    }
    .toolbar .group{flex-direction:row; flex-wrap:wrap; justify-content:center; gap:5px}
    .toolbar .glabel{flex-basis:100%; text-align:center}
    .toolbar .toolbtn{flex-basis:100%; font-size:11.5px; padding:5px 4px}
    .crayon{width:25px; height:25px}
    .sizebtn{width:25px; height:25px}
    .rotate-hint{display:none !important}
  }

  /* Maximised mode — the fallback when the browser refuses the real
     Fullscreen API (common inside an embedded frame, and on iPhones,
     which have no element fullscreen at all). The progress row floats
     over the top of the field and the maze gets the full height of
     the screen, so the maze still grows as large as the screen allows.
     The toolbar stays reachable: bottom bar in portrait, the side
     rail in landscape. */
  body.max .progress-row{
    position:fixed; top:0; left:0; right:0; z-index:30;
    padding:6px 12px 16px;
    background:linear-gradient(rgba(38,84,30,.92), rgba(38,84,30,0));
  }
  @media (orientation:portrait){
    body.max .toolbar{
      position:fixed; left:0; right:0; bottom:0; z-index:30;
      background:rgba(53,112,43,.95);
      box-shadow:0 -3px 14px rgba(0,0,0,.25);
    }
  }
  @media (orientation:landscape){
    body.max{
      grid-template-rows:1fr;
      grid-template-areas:"stage tools";
    }
    body.max .stage{padding-top:34px}
  }

  /* Pen position marker — shows where the pen is; after a wall hit it
     snaps back to the last save point, the only place a new line may start */
  .pen-marker{position:absolute; z-index:6; width:40px; height:40px; margin:-20px 0 0 -20px; pointer-events:none}
  .pen-marker .ring{position:absolute; inset:0; border-radius:50%; border:4px solid var(--orange); background:rgba(255,255,255,.25); animation:penpulse 1.2s ease-in-out infinite}
  .pen-marker .dot{position:absolute; left:50%; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:var(--orange-dark); border:3px solid #fff; box-shadow:0 1px 5px rgba(0,0,0,.35)}
  .pen-marker.snap .ring{animation:penpop .45s ease,penpulse 1.2s ease-in-out .45s infinite}
  @keyframes penpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  @keyframes penpop{0%{transform:scale(.3)}60%{transform:scale(1.55)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion: reduce){ .pen-marker .ring,.pen-marker.snap .ring{animation:none} }

  /* Oops overlay (rule D) */
  .oops{position:absolute; inset:0; z-index:7; display:none; place-items:center; pointer-events:none; text-align:center; padding:20px}
  .oops.show{display:grid}
  .oops .box{background:#fff; border:4px solid #E03131; border-radius:18px; padding:12px 22px; box-shadow:0 12px 26px rgba(0,0,0,.2); animation:pop .35s ease}
  .oops h2{color:#E03131; font-size:clamp(22px,4vw,34px); margin:0 0 2px}
  .oops p{font-weight:800; color:var(--ink2); margin:0; font-size:14px}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion: reduce){ .oops .box{animation:none} }

  /* Win overlay */
  .win{position:absolute; inset:0; z-index:8; display:none; place-items:center; background:rgba(255,250,230,.72); text-align:center; padding:20px}
  .win.show{display:grid}
  .win .box{background:#fff; border:4px solid var(--orange); border-radius:20px; padding:18px 24px; max-width:400px; box-shadow:0 14px 30px rgba(0,0,0,.18)}
  .win .big{font-size:48px; line-height:1}
  .win h2{color:var(--orange-dark); font-size:28px; margin:6px 0 4px}
  .win p{font-weight:800; color:var(--ink2); margin:0 0 12px}
  .win button{font-family:inherit; font-weight:900; font-size:15px; background:var(--green); color:#fff; border:none; border-bottom:4px solid var(--green-dark); border-radius:12px; padding:10px 20px; cursor:pointer}
  .confetti{position:absolute; width:10px; height:16px; z-index:9; pointer-events:none; border-radius:2px}
</style>
</head>

(function(){
  "use strict";
  // Board space: 2048 x 1152 — the approved top-down maze image itself,
  // embedded above as the board background (base64, fully offline).
  var W=2048,H=1152;
  var markerC=document.getElementById('markerCanvas');
  var ink=document.getElementById('inkCanvas');
  var hintC=document.getElementById('hintCanvas');
  var rewindC=document.getElementById('rewindCanvas');
  var mctx=markerC.getContext('2d'), ictx=ink.getContext('2d'), hctx=hintC.getContext('2d'), rctx=rewindC.getContext('2d');
  var board=document.getElementById('board');

  // ---- Positions read off the white channels of the approved image ----
  // Rabbit / START opening at bottom-left, big carrot / FINISH bottom-right.
  var START={x:540,y:830}, FINISH={x:1520,y:845};
  // FREE-ORDER CARROTS: 6 small carrots scattered along the maze paths,
  // where the child's red-route drawing put them, each nudged to the
  // centre of its white corridor so it never touches a hedge (checked
  // against the mask below: every carrot sits well clear of the nearest
  // hedge). They may be collected in ANY order, by whichever path the
  // child likes, and NONE of them is required to reach FINISH.
  var CARROTS=[
    {x:395,y:270},   // top-left corner turn
    {x:950,y:232},   // top corridor, centre
    {x:1672,y:300},  // top-right, start of the right-hand descent
    {x:788,y:458},   // middle band, west of the centre hedge
    {x:1388,y:500},  // middle-right pocket
    {x:972,y:665}    // lower-middle junction
  ];
  var CARROT_R=70,      // capture radius around a small carrot
      FINISH_R=90,      // capture radius around the big FINISH carrot
      HEAD_R=210,       // a new line may only begin this close to the line's head / last save point
      LOCK_R=115;       // after a wall hit: a new line may ONLY begin this close to the last save point

  // ---- Walkable map: a 16px grid measured from the approved maze image
  // itself (flood-filled from START through the white channels, then
  // eroded by ~12px, so it traces the centre of each corridor).
  // '#' = white path, '.' = hedge / wall. Because the grid comes from the
  // real image, EVERY white corridor counts — side paths and dead ends
  // included, so any route to any carrot is allowed — and thin hedge
  // gaps (like the old 4-to-5 hedge shortcut) are solid walls here.
  // The pen test widens this grid by one cell on every side (see WIDE
  // below) so off-centre drawing inside the real white paths counts,
  // and the pen is re-sampled every 6px while it moves (see
  // pointermove), so even a fast swipe cannot jump over a hedge.
  var CELL=16, GW=128, GH=72;
  var MASK=[
    "................................................................................................................................",
    "................................................................................................................................",
    "................................................................................................................................",
    "................................................................................................................................",
    "................................................................................................................................",
    "................................................................................................................................",

    ".........................................................####...................................................................",

    "........................############################.....#########..######################################......................",
    ".......................#####.................######......######........#........###########........#.#####......................",
    ".......................###.....................####.....#####......................#####..............##.#......................",
    ".......................###......................###.....#####.......................####...............###......................",
    ".......................###......................###.....#####.......................####...............###......................",
    "......................####......................###.....#####......................#####...............###......................",
    "......................####.........########....####.....#########.###.....#####.#.########..#..........###......................",

    "......................###......#########.#.....####.....###..#########.....##############.########.....####.....................",
    ".....................####......####............####..............#####.....####..............#####......###.....................",
    ".....................###.......###.............####...............####.....####...............#####.....###.....................",

  function cellWalkable(cx,cy){
    if(cx<0||cy<0||cx>=GW||cy>=GH) return false;
    return MASK[cy].charAt(cx)==='#';
  }
  // ---- Drawing tolerance: the grid above traces only the CENTRE of
  // each corridor (it was eroded when measured from the artwork), so
  // testing the pen against it raw fails a child who draws well inside
  // a wide white path but off-centre — long / far routes became nearly
  // impossible and every small slip sent the pen back to the start.
  // For the pen test only, a cell also counts when any of its 8
  // neighbours is a corridor cell (~16px of grace on every side).
  // Real hedges stay solid: in the measured grid they are 3+ cells
  // thick, and every thinner "gap" was checked against the artwork
  // itself — those spots are white path the erosion pinched away, not
  // hedge. The Hint's A* keeps the strict grid, so its route still
  // hugs the corridor centres.
  var WIDE=[];
  (function(){
    for(var y=0;y<GH;y++){
      var row=[];
      for(var x=0;x<GW;x++){
        var w=false;
        for(var dy=-1;dy<=1&&!w;dy++) for(var dx=-1;dx<=1;dx++){
          if(cellWalkable(x+dx,y+dy)){ w=true; break; }
        }
        row.push(w);
      }
      WIDE.push(row);
    }
  })();
  function cellDrawable(cx,cy){
    if(cx<0||cy<0||cx>=GW||cy>=GH) return false;
    return WIDE[cy][cx];
  }
  function inside(x,y){
    if(Math.hypot(x-START.x,y-START.y)<=88||Math.hypot(x-FINISH.x,y-FINISH.y)<=88) return true;
    return cellDrawable(Math.floor(x/CELL),Math.floor(y/CELL));
  }
  function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

  // ---- Shortest route on the walkable grid (A*): Hint draws the
  // shortest white-path route from the pen's CURRENT position to FINISH,
  // never through a hedge. ----
  function nearestCell(pt){
    var cx=Math.floor(pt.x/CELL), cy=Math.floor(pt.y/CELL);
    if(cellWalkable(cx,cy)) return {cx:cx,cy:cy};
    for(var r=1;r<14;r++){
      for(var dy=-r;dy<=r;dy++) for(var dx=-r;dx<=r;dx++){
        if(cellWalkable(cx+dx,cy+dy)) return {cx:cx+dx,cy:cy+dy};
      }
    }
    return {cx:cx,cy:cy};
  }
  function hintPath(from,to){
    var s=nearestCell(from), g=nearestCell(to);
    var N=GW*GH, gScore=new Float64Array(N), fScore=new Float64Array(N), came=new Int32Array(N), closed=new Uint8Array(N);
    for(var i=0;i<N;i++){ gScore[i]=Infinity; fScore[i]=Infinity; came[i]=-1; }
    var si=s.cy*GW+s.cx, gi=g.cy*GW+g.cx;
    gScore[si]=0; fScore[si]=Math.abs(s.cx-g.cx)+Math.abs(s.cy-g.cy);
    var heap=[si];
    function push(v){ heap.push(v); var c=heap.length-1; while(c>0){ var p=(c-1)>>1; if(fScore[heap[p]]<=fScore[heap[c]]) break; var t=heap[p]; heap[p]=heap[c]; heap[c]=t; c=p; } }
    function pop(){ var top=heap[0], last=heap.pop(); if(heap.length){ heap[0]=last; var c=0; for(;;){ var l=2*c+1, r=l+1, m=c; if(l<heap.length&&fScore[heap[l]]<fScore[heap[m]]) m=l; if(r<heap.length&&fScore[heap[r]]<fScore[heap[m]]) m=r; if(m===c) break; var t=heap[m]; heap[m]=heap[c]; heap[c]=t; c=m; } } return top; }
    var found=false;
    while(heap.length){
      var cur=pop();
      if(cur===gi){ found=true; break; }
      if(closed[cur]) continue; closed[cur]=1;
      var cx=cur%GW, cy=(cur-cx)/GW;
      var nb=[[1,0],[-1,0],[0,1],[0,-1]];
      for(var k=0;k<4;k++){
        var nx=cx+nb[k][0], ny=cy+nb[k][1];
        if(!cellWalkable(nx,ny)) continue;
        var ni=ny*GW+nx, tent=gScore[cur]+1;
        if(tent<gScore[ni]){ gScore[ni]=tent; fScore[ni]=tent+Math.abs(nx-g.cx)+Math.abs(ny-g.cy); came[ni]=cur; push(ni); }
      }
    }
    if(!found) return [];
    var cells=[], c2=gi;
    while(c2!==-1){ cells.push({x:(c2%GW)*CELL+CELL/2, y:Math.floor(c2/GW)*CELL+CELL/2}); if(c2===si) break; c2=came[c2]; }
    cells.reverse();
    // Simplify: keep a point only when the straight line ahead leaves the white paths
    var pts=[{x:from.x,y:from.y}], anchor=0;
    function clearLine(a,b){
      var d=Math.hypot(b.x-a.x,b.y-a.y), steps=Math.max(1,Math.ceil(d/8));
      for(var j=1;j<steps;j++){
        var x=a.x+(b.x-a.x)*j/steps, y=a.y+(b.y-a.y)*j/steps;
        if(!cellWalkable(Math.floor(x/CELL),Math.floor(y/CELL))) return false;
      }
      return true;
    }
    for(var m=1;m<cells.length;m++){
      if(!clearLine(cells[anchor],cells[m])){ pts.push(cells[m-1]); anchor=m-1; }
    }
    pts.push({x:to.x,y:to.y});
    return pts;
  }

  // ---- Carrot markers: an uncollected carrot waits on its path; a
  // collected one turns into a green tick. No numbers — any order is fine.
  function drawMarkers(){
    mctx.clearRect(0,0,W,H);
    mctx.textAlign='center'; mctx.textBaseline='middle';
    for(var k=0;k<CARROTS.length;k++){
      var p=CARROTS[k];
      mctx.beginPath(); mctx.arc(p.x,p.y,30,0,7);
      mctx.shadowColor='rgba(35,64,94,.35)'; mctx.shadowBlur=8; mctx.shadowOffsetY=3;
      if(collected[k]){ // collected
        mctx.fillStyle='#5FA84C'; mctx.fill(); mctx.shadowColor='transparent';
        mctx.lineWidth=4; mctx.strokeStyle='#3E7D32'; mctx.stroke();
        mctx.fillStyle='#fff'; mctx.font='900 30px sans-serif'; mctx.fillText('\u2713',p.x,p.y+2);
        if(k===lastSaveIdx){ mctx.beginPath(); mctx.arc(p.x,p.y,38,0,7); mctx.lineWidth=5; mctx.strokeStyle='#FFB03A'; mctx.stroke(); }
      } else { // still waiting to be found
        mctx.fillStyle='#fff'; mctx.fill(); mctx.shadowColor='transparent';
        mctx.lineWidth=(k===lastSaveIdx)?7:5; mctx.strokeStyle='#F07D1A'; mctx.stroke();
        mctx.font='38px serif'; mctx.fillText('\uD83E\uDD55',p.x,p.y+3);
      }
    }
    mctx.shadowColor='transparent'; mctx.shadowBlur=0; mctx.shadowOffsetY=0;
  }

  // ---- Hint: dashed SHORTEST route from the pen's current position
  // (its head, or the last save point after a wall hit) to FINISH ----
  function drawHint(on){
    hctx.clearRect(0,0,W,H);
    if(!on) return;
    var from=mustRestart?anchorPos():headPos();
    var pts=hintPath(from,FINISH);
    if(pts.length<2) return;
    hctx.strokeStyle='rgba(240,125,26,.85)'; hctx.lineWidth=14; hctx.setLineDash([8,32]); hctx.lineCap='round'; hctx.lineJoin='round';
    hctx.beginPath(); pts.forEach(function(p,i){ i?hctx.lineTo(p.x,p.y):hctx.moveTo(p.x,p.y); }); hctx.stroke(); hctx.setLineDash([]);
  }

  // ---- Game state ----
  var strokes=[], currentStroke=null, activePath=null;
  var color='#F0541E', size=20, erasing=false, hintOn=false;
  var drawing=false, needLift=false, lastPt=null;
  var collected=[false,false,false,false,false,false], segId=0, lastSaveIdx=-1, started=false, solved=false;
  var mustRestart=false; // after a wall hit: next line may ONLY start at the last save point
  var rewinding=false, blockStroke=false, rewindRAF=null, lastSay=0;

  // The line's "head": newest ink drawn in the current segment (since
  // the last save point), otherwise that save point itself. New ink must
  // begin near it.
  function headPos(){
    for(var i=strokes.length-1;i>=0;i--){
      var paths=strokes[i].paths;
      for(var j=paths.length-1;j>=0;j--){
        var path=paths[j];
        for(var k=path.length-1;k>=0;k--){ if(path[k].seg===segId) return path[k]; }
      }
    }
    return anchorPos();
  }

  // The last save point: the last carrot touched, or START (the rabbit)
  // when no carrot has been touched yet. After a wall hit the pen returns
  // here, and the next line may only begin here.
  function anchorPos(){ return lastSaveIdx<0?START:CARROTS[lastSaveIdx]; }
  function collectedCount(){ var n=0; for(var i=0;i<collected.length;i++) if(collected[i]) n++; return n; }
  function gatePos(){ return mustRestart?anchorPos():headPos(); }
  function gateRadius(){ return mustRestart?LOCK_R:HEAD_R; }

  // ---- Visible pen position: a pulsing marker that follows the pen tip
  // while drawing and snaps back to the anchor save point on a wall hit ----
  var penMarker=document.getElementById('penMarker');
  function placePenMarker(pt,snap){
    if(!penMarker||!pt) return;
    penMarker.style.left=(pt.x/W*100)+'%';
    penMarker.style.top=(pt.y/H*100)+'%';
    penMarker.style.display=solved?'none':'block';
    if(snap){ penMarker.classList.remove('snap'); void penMarker.offsetWidth; penMarker.classList.add('snap'); }
  }

  function renderInk(){
    ictx.clearRect(0,0,W,H); ictx.lineCap='round'; ictx.lineJoin='round';
    strokes.forEach(function(st){
      ictx.strokeStyle=st.color; ictx.lineWidth=st.size;
      st.paths.forEach(function(path){
        if(!path.length) return;
        ictx.beginPath(); ictx.moveTo(path[0].x,path[0].y);
        if(path.length===1) ictx.lineTo(path[0].x+0.1,path[0].y+0.1);
        for(var i=1;i<path.length;i++) ictx.lineTo(path[i].x,path[i].y);
        ictx.stroke();

    });
  }
  function toLocal(e){
    var r=ink.getBoundingClientRect();
    return { x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height };
  }

  // ---- Sound (tiny WebAudio blips, created on user gesture) ----
  var AC=null;
  function tone(f,t0,dur,type,vol){
    try{
      AC=AC||new (window.AudioContext||window.webkitAudioContext)();
      if(AC.state==='suspended') AC.resume();
      var o=AC.createOscillator(),g=AC.createGain();
      o.type=type||'sine'; o.frequency.value=f;
      g.gain.setValueAtTime(vol||.12,AC.currentTime+t0);
      g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t0+dur);
      o.connect(g); g.connect(AC.destination);
      o.start(AC.currentTime+t0); o.stop(AC.currentTime+t0+dur+.02);
    }catch(e){}
  }

  function updateProgress(msg){
    var n=collectedCount();
    var pct=solved?100:Math.round(100*n/CARROTS.length);
    document.getElementById('progressFill').style.width=pct+'%';
    document.getElementById('progressText').textContent=n+' of '+CARROTS.length+' \uD83E\uDD55';
    var st=document.getElementById('statusText');
    if(msg){ st.textContent=msg; return; }
    if(solved) st.textContent=(n>=CARROTS.length)?'Perfect! \u2B50\u2B50\u2B50':'Finished! \u2B50';
    else if(n===0) st.textContent='Start \uD83D\uDC30 \u2192 find carrots \uD83E\uDD55';
    else if(n>=CARROTS.length) st.textContent='All '+CARROTS.length+' carrots! \u2192 \uD83E\uDD55 FINISH';
    else st.textContent='\uD83E\uDD55 '+n+' of '+CARROTS.length+' \u2014 FINISH anytime!';
  }

  // Any carrot the pen touches is collected (any order) and becomes the
  // new save point; reaching the big FINISH carrot wins at ANY time,
  // however many small carrots were collected.
  function checkCaptures(pt){
    if(solved) return;
    for(var i=0;i<CARROTS.length;i++){
      if(!collected[i]&&dist(pt,CARROTS[i])<=CARROT_R){
        collected[i]=true; lastSaveIdx=i; segId++; started=true;
        tone(560+i*60,0,.18,'sine',.12); tone(880,.09,.16,'sine',.1);
        drawMarkers(); updateProgress(); drawHint(hintOn);
      }
    }
    if(dist(pt,FINISH)<=FINISH_R) winGame();
  }
  function winGame(){
    solved=true;
    hideAnchorHint();
    if(penMarker) penMarker.style.display='none';
    var n=collectedCount(), perfect=n>=CARROTS.length;
    document.getElementById('winEmoji').textContent=perfect?'\uD83D\uDC30\uD83E\uDD55\u2B50\u2B50\u2B50':'\uD83D\uDC30\uD83E\uDD55\u2B50';
    document.getElementById('winTitle').textContent=perfect?'Perfect!':'You did it!';
    document.getElementById('winText').textContent=perfect
      ?'You collected ALL '+CARROTS.length+' carrots, then reached the big carrot!'
      :'The rabbit found the big carrot! Carrots collected: '+n+' of '+CARROTS.length+'.';
    document.getElementById('winOverlay').classList.add('show');
    confetti(); updateProgress();
    [523,659,784,1047].forEach(function(f,i){ tone(f,i*.13,.3,'sine',.12); });
    if(perfect) [880,1047,1319].forEach(function(f,i){ tone(f,.55+i*.13,.32,'sine',.12); });
  }

  // ---- Anchor hint (rule C): after a wall hit the last save point grows,
  // blinks and calls out until the child taps exactly on it. ----
  var anchorHint=document.getElementById('anchorHint');
  function showAnchorHint(pt){
    if(!anchorHint||!pt) return;
    anchorHint.style.left=(pt.x/W*100)+'%';
    anchorHint.style.top=(pt.y/H*100)+'%';
    anchorHint.classList.add('show');
  }
  function hideAnchorHint(){ if(anchorHint) anchorHint.classList.remove('show','nudge'); }
  function sayHere(){
    try{
      if(!window.speechSynthesis) return;
      var now=Date.now(); if(now-lastSay<1500) return; lastSay=now;
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance('Start here!');
      u.lang='en-US'; u.rate=1.05; u.pitch=1.15;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function cueHere(speak){
    tone(880,0,.12,'sine',.11); tone(1175,.13,.2,'sine',.11);
    if(speak) sayHere();
  }
  function nudgeAnchor(){
    var a=anchorPos();
    showAnchorHint(a);
    if(anchorHint){ anchorHint.classList.remove('nudge'); void anchorHint.offsetWidth; anchorHint.classList.add('nudge'); }
    placePenMarker(a,true);
    cueHere(true);
  }

  // ---- Rule A: rewind — the pen marker travels back along the failed
  // path to the last save point while the dashed trail shrinks away. ----
  function drawTrail(pts){
    rctx.clearRect(0,0,W,H);
    if(!pts||pts.length<2) return;
    rctx.strokeStyle='rgba(224,49,49,.7)'; rctx.lineWidth=12;
    rctx.setLineDash([26,20]); rctx.lineCap='round'; rctx.lineJoin='round';
    rctx.beginPath(); rctx.moveTo(pts[0].x,pts[0].y);
    for(var i=1;i<pts.length;i++) rctx.lineTo(pts[i].x,pts[i].y);
    rctx.stroke(); rctx.setLineDash([]);
  }
  function cancelRewind(){
    if(rewindRAF) cancelAnimationFrame(rewindRAF);
    rewindRAF=null; rewinding=false; rctx.clearRect(0,0,W,H);
  }
  function finishRewind(anchor){
    rewinding=false; rewindRAF=null;
    rctx.clearRect(0,0,W,H);
    placePenMarker(anchor,true);
    showAnchorHint(anchor);
    cueHere(false);
  }
  function animateRewind(trail,anchor){
    cancelRewind(); hideAnchorHint();
    var pts=trail.slice();
    if(!pts.length||dist(pts[0],anchor)>1) pts.unshift({x:anchor.x,y:anchor.y});
    var rev=pts.slice().reverse(), n=rev.length;
    var total=0, cum=[0], i;
    for(i=1;i<n;i++){ total+=dist(rev[i-1],rev[i]); cum.push(total); }
    if(n<2||total<30||window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      finishRewind(anchor); return;
    }
    rewinding=true;
    var dur=Math.min(1300,Math.max(420,total*0.85)), t0=null;
    function frame(ts){
      if(!rewinding) return;
      if(!t0) t0=ts;
      var t=Math.min(1,(ts-t0)/dur), d=t*total, j=1;
      while(j<cum.length-1&&cum[j]<d) j++;
      var segLen=(cum[j]-cum[j-1])||1, f=Math.min(1,Math.max(0,(d-cum[j-1])/segLen));
      var pos={x:rev[j-1].x+(rev[j].x-rev[j-1].x)*f, y:rev[j-1].y+(rev[j].y-rev[j-1].y)*f};
      placePenMarker(pos,false);
      var remain=pts.slice(0,n-j); remain.push(pos);
      drawTrail(remain);
      if(t>=1){ finishRewind(anchor); return; }
      rewindRAF=requestAnimationFrame(frame);
    }
    rewindRAF=requestAnimationFrame(frame);
  }

  // ---- Rules A + C: touching the hedge wipes the WHOLE line drawn since
  // the last save point, the pen marker visibly travels back along that
  // path to the last save point (or the rabbit), and drawing stays locked
  // until the child taps exactly on that checkpoint. ----
  var oopsTimer=null;
  function wallHit(){
    // Capture the failed segment's path BEFORE wiping it, for the rewind.
    var trail=[];
    strokes.forEach(function(st){ st.paths.forEach(function(path){
      path.forEach(function(p){ if(p.seg===segId) trail.push({x:p.x,y:p.y}); });
    });});
    // The whole failed segment is wiped automatically.
    strokes.forEach(function(st){
      st.paths.forEach(function(path){
        for(var i=path.length-1;i>=0;i--){ if(path[i].seg===segId) path.splice(i,1); }
      });
      st.paths=st.paths.filter(function(p){return p.length;});
    });
    strokes=strokes.filter(function(st){return st.paths.length;});
    currentStroke=null; activePath=null; drawing=false; needLift=true;
    mustRestart=true; blockStroke=true;
    renderInk();
    var where=lastSaveIdx<0?'the rabbit \uD83D\uDC30':'your last carrot \uD83E\uDD55';
    document.getElementById('oopsText').textContent='You touched the hedge! Start again from '+where;
    var ov=document.getElementById('oopsOverlay');
    ov.classList.add('show');
    clearTimeout(oopsTimer);
    oopsTimer=setTimeout(function(){ ov.classList.remove('show'); },1500);
    tone(220,0,.16,'square',.07); tone(160,.14,.22,'square',.07);
    updateProgress(lastSaveIdx<0?'Oops! Back to \uD83D\uDC30':'Oops! Back to your last \uD83E\uDD55'); drawHint(hintOn);
    animateRewind(trail,anchorPos());
  }

  function addPoint(pt){
    if(!currentStroke){ currentStroke={color:color,size:size,paths:[]}; strokes.push(currentStroke); }
    if(!activePath){ activePath=[]; currentStroke.paths.push(activePath); }
    var p={x:pt.x,y:pt.y,seg:segId};
    activePath.push(p); started=true; mustRestart=false;
    checkCaptures(p);
    placePenMarker(p,false);
    renderInk();
  }

  ink.addEventListener('pointerdown',function(e){
    e.preventDefault();
    if(solved||rewinding) return;
    ink.setPointerCapture(e.pointerId);
    var pt=toLocal(e); lastPt=pt;
    if(erasing){ eraseAt(pt); return; }
    if(needLift) return;
    if(mustRestart){
      // Rule C: locked. Only a tap exactly on the last save point (or the
      // rabbit) unlocks drawing — and the new line starts at that point.
      // A tap anywhere else makes NO ink at all, even if the child then
      // drags across the checkpoint during the same touch.
      if(dist(pt,anchorPos())<=LOCK_R){
        mustRestart=false; blockStroke=false; hideAnchorHint();
        drawing=true; currentStroke=null; activePath=null;
        addPoint(anchorPos());
        if(inside(pt.x,pt.y)&&dist(pt,anchorPos())>4) addPoint(pt);
        lastPt=inside(pt.x,pt.y)?pt:anchorPos();
      } else {
        blockStroke=true; drawing=false;
        nudgeAnchor();
      }
      return;
    }
    drawing=true; currentStroke=null; activePath=null;
    if(inside(pt.x,pt.y)&&dist(pt,gatePos())<=gateRadius()) addPoint(pt);
  });
  ink.addEventListener('pointermove',function(e){
    if(!lastPt) return;
    var pt=toLocal(e);
    if(blockStroke||rewinding){ lastPt=pt; return; }
    if(erasing){ if(e.buttons) eraseAt(pt); lastPt=pt; return; }
    if(!drawing||needLift||solved){ lastPt=pt; return; }
    e.preventDefault();
    // sample every ~6 board px along the movement, so even a fast swipe
    // across a hedge is caught — it cannot jump a wall between samples
    var d=Math.hypot(pt.x-lastPt.x,pt.y-lastPt.y), steps=Math.max(1,Math.ceil(d/6));
    for(var i=1;i<=steps;i++){
      var s={x:lastPt.x+(pt.x-lastPt.x)*i/steps, y:lastPt.y+(pt.y-lastPt.y)*i/steps};
      if(activePath){
        if(inside(s.x,s.y)){ addPoint(s); if(solved){ lastPt=pt; return; } }
        else { wallHit(); lastPt=pt; return; }
      } else if(inside(s.x,s.y)&&dist(s,gatePos())<=gateRadius()){
        addPoint(s);
      }
    }
    lastPt=pt;
  });
  function endStroke(){ drawing=false; currentStroke=null; activePath=null; needLift=false; blockStroke=false; lastPt=null; if(!rewinding) placePenMarker(mustRestart?anchorPos():headPos(),false); }
  ink.addEventListener('pointerup',endStroke);
  ink.addEventListener('pointercancel',endStroke);

  function eraseAt(pt){
    if(!inside(pt.x,pt.y)) return;
    var r=size*1.5, changed=false;
    strokes.forEach(function(st){ st.paths.forEach(function(path){
      for(var i=path.length-1;i>=0;i--){ if(Math.hypot(path[i].x-pt.x,path[i].y-pt.y)<r){ path.splice(i,1); changed=true; } }
    });});
    if(changed) renderInk();
  }

  function confetti(){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var colors=['#F07D1A','#5FA84C','#FFD23F','#E754B8','#2B7CD3'];
    for(var i=0;i<60;i++){ var d=document.createElement('div'); d.className='confetti';
      d.style.background=colors[i%colors.length]; d.style.left=(Math.random()*96)+'%'; d.style.top='-20px';
      board.appendChild(d);
      var dx=(Math.random()*120-60), dy=360+Math.random()*240, rot=Math.random()*540;
      d.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) rotate('+rot+'deg)',opacity:.9}],{duration:1400+Math.random()*900,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=(function(el){return function(){el.remove();};})(d);
    }
  }

  // ---- Toolbar ----
  document.querySelectorAll('.crayon').forEach(function(b){ b.addEventListener('click',function(){
    document.querySelectorAll('.crayon').forEach(function(x){x.setAttribute('aria-pressed','false');});
    b.setAttribute('aria-pressed','true'); color=b.getAttribute('data-color'); setErase(false);
  });});
  document.querySelectorAll('.sizebtn').forEach(function(b){ b.addEventListener('click',function(){
    document.querySelectorAll('.sizebtn').forEach(function(x){x.setAttribute('aria-pressed','false');});
    b.setAttribute('aria-pressed','true'); size=parseInt(b.getAttribute('data-size'),10);
  });});
  var eraserBtn=document.getElementById('eraserBtn');
  function setErase(on){ erasing=on; eraserBtn.classList.toggle('on',on); eraserBtn.setAttribute('aria-pressed',on?'true':'false'); ink.style.cursor=on?'cell':'crosshair'; }
  eraserBtn.addEventListener('click',function(){ setErase(!erasing); });
  document.getElementById('undoBtn').addEventListener('click',function(){ strokes.pop(); currentStroke=null; activePath=null; renderInk(); });
  function resetAll(){ cancelRewind(); strokes=[]; currentStroke=null; activePath=null; collected=[false,false,false,false,false,false]; segId=0; lastSaveIdx=-1; started=false; solved=false; needLift=false; mustRestart=false; blockStroke=false; drawing=false;
    hideAnchorHint();
    document.getElementById('winOverlay').classList.remove('show');
    document.getElementById('oopsOverlay').classList.remove('show');
    drawMarkers(); drawHint(hintOn); renderInk(); updateProgress(); placePenMarker(START,false); }
  document.getElementById('startBtn').addEventListener('click',function(){ setErase(false); resetAll(); tone(660,0,.12,'sine',.1); tone(880,.1,.16,'sine',.1); });
  document.getElementById('clearBtn').addEventListener('click',resetAll);
  document.getElementById('againBtn').addEventListener('click',resetAll);
  var hintBtn=document.getElementById('hintBtn');
  hintBtn.addEventListener('click',function(){ hintOn=!hintOn; hintBtn.classList.toggle('on',hintOn); hintBtn.setAttribute('aria-pressed',hintOn?'true':'false'); drawHint(hintOn); });
  document.getElementById('testBtn').addEventListener('click',function(){
    // wild scribble across the whole map — only the parts on the white paths stick
    var test={color:'#E03131',size:20,paths:[[]]}, pts=[];
    for(var i=0;i<=200;i++){ var t=i/200; pts.push({x:60+1928*t, y:576+414*Math.sin(t*Math.PI*5)+196*Math.sin(t*Math.PI*17)}); }
    var cur=test.paths[0];
    for(var k=0;k<pts.length;k++){ var p=pts[k];
      if(inside(p.x,p.y)){ cur.push({x:p.x,y:p.y,seg:-1}); } else if(cur.length){ cur=[]; test.paths.push(cur); } }
    test.paths=test.paths.filter(function(p){return p.length;});
    if(!test.paths.length) return;
    strokes.push(test); renderInk();
    setTimeout(function(){ var ix=strokes.indexOf(test); if(ix>-1) strokes.splice(ix,1); renderInk(); },2200);
  });

  // ---- Fullscreen, honestly: browsers refuse the Fullscreen API
  // inside embedded frames that were not granted it, and iPhones do
  // not offer element fullscreen at all — the old button swallowed
  // that refusal, so tapping it did nothing at all. Now the tap first
  // tries the real API; if the browser has not REALLY entered
  // fullscreen afterwards, the page falls back to its own maximised
  // mode (body.max) so the maze still grows to fill the screen.
  function tryRealFullscreen(){
    try{
      var el=document.documentElement;
      var req=el.requestFullscreen||el.webkitRequestFullscreen;
      if(!req) return Promise.resolve(false);
      var r=req.call(el);
      if(r&&r.then) return r.then(function(){ return !!document.fullscreenElement; },function(){ return !!document.fullscreenElement; });
      return new Promise(function(res){ setTimeout(function(){ res(!!document.fullscreenElement); },80); });
    }catch(e){ return Promise.resolve(false); }
  }
  function lockOrientation(){
    try{ if(screen.orientation&&screen.orientation.lock){ var r=screen.orientation.lock('landscape'); if(r&&r.catch) r.catch(function(){}); } }catch(e){}
  }
  // ---- Landscape: ask the browser for fullscreen + a landscape lock.
  // Needs a user tap (the buttons below); if fullscreen is refused the
  // CSS landscape layout still applies as soon as the phone is turned.
  function lockLandscape(){
    tryRealFullscreen().then(function(ok){ if(ok) lockOrientation(); });
  }
  var lockBtn=document.getElementById('lockBtn');
  if(lockBtn) lockBtn.addEventListener('click',lockLandscape);
  // ---- Fullscreen toggle: the clear toolbar button. One tap makes the
  // maze fill the screen; tapping it again — or pressing Esc in real
  // fullscreen — exits. The button lives in the toolbar (bottom bar in
  // portrait, side rail in landscape), so it is always visible and
  // never covers the maze. Its label follows the real state.
  var fsBtn=document.getElementById('fsBtn');
  function syncFsBtn(){
    var on=!!document.fullscreenElement||document.body.classList.contains('max');
    fsBtn.textContent=on?'\u2715 Exit Fullscreen':'\u26F6 Fullscreen';
    fsBtn.setAttribute('aria-pressed',on?'true':'false');
    fsBtn.classList.toggle('on',on);
  }
  fsBtn.addEventListener('click',function(){
    if(document.fullscreenElement){
      try{
        var r=document.exitFullscreen?document.exitFullscreen():null;
        if(r&&r.catch) r.catch(function(){});
      }catch(e){}
      setTimeout(syncFsBtn,80);
    } else if(document.body.classList.contains('max')){
      document.body.classList.remove('max');
      syncFsBtn();
    } else {
      tryRealFullscreen().then(function(ok){
        if(ok) lockOrientation();
        else document.body.classList.add('max');
        syncFsBtn();
      });
    }
  });
  document.addEventListener('fullscreenchange',syncFsBtn);
  document.addEventListener('webkitfullscreenchange',syncFsBtn);
  syncFsBtn();
  var hintClose=document.getElementById('hintClose');
  if(hintClose) hintClose.addEventListener('click',function(){
    document.getElementById('rotateHint').style.display='none';
  });

  drawMarkers(); drawHint(false); renderInk(); updateProgress(); placePenMarker(START,false);
})();
</script>
</body>
</html>
